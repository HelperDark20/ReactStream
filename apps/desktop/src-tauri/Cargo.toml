[package]
name = "reactstream-desktop"
version = "0.1.0"
description = "ReactStream — shell Tauri 2 (mínimo privilegio, Regla #58)"
edition = "2021"

[lib]
name = "reactstream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
directories = "5"
rfd = "0.14"
reactstream-core = { path = "../../../core/rust" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com"] }
