<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rim" x1="18" y1="18" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFA6"/>
      <stop offset=".36" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#15D00A"/>
    </linearGradient>
    <filter id="halo" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="pauseGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="47" stroke="#39FF14" stroke-opacity=".26" stroke-width="4.5" filter="url(#halo)"/>
  <circle cx="60" cy="60" r="45.5" stroke="url(#rim)" stroke-width="2.6"/>
  <circle cx="60" cy="60" r="42.5" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>

  <path
    d="M28 41C35 27 48 20 63 19C73 19 82 22 91 28"
    stroke="#FFFFFF"
    stroke-opacity=".22"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <rect x="45" y="41" width="10" height="38" rx="4" fill="#39FF14" fill-opacity=".94"
        stroke="#E8FFE4" stroke-opacity=".38" stroke-width="1" filter="url(#pauseGlow)"/>
  <rect x="65" y="41" width="10" height="38" rx="4" fill="#39FF14" fill-opacity=".94"
        stroke="#E8FFE4" stroke-opacity=".38" stroke-width="1" filter="url(#pauseGlow)"/>
</svg>
