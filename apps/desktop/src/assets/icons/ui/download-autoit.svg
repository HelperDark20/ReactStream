<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="darkFill" x1="28" y1="16" x2="101" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F2F2"/>
      <stop offset="0.16" stop-color="#B8B8B8"/>
      <stop offset="0.48" stop-color="#686868"/>
      <stop offset="0.78" stop-color="#303030"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>

    <linearGradient id="edge" x1="23" y1="103" x2="105" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151515"/>
      <stop offset="0.42" stop-color="#E4E4E4"/>
      <stop offset="0.68" stop-color="#858585"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>

    <linearGradient id="shaft" x1="64" y1="28" x2="64" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFA"/>
      <stop offset="0.35" stop-color="#AFAFAF"/>
      <stop offset="0.72" stop-color="#5D5D5D"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>

    <filter id="shadowGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle dark bloom -->
  <path
    d="M64 14 V78 M42 60 L64 82 L86 60 M27 103 H101"
    stroke="#000000"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.22"
    filter="url(#shadowGlow)"
  />

  <!-- Download shaft -->
  <path
    d="M64 17 V78"
    stroke="url(#shaft)"
    stroke-width="11"
    stroke-linecap="round"
    filter="url(#shadowGlow)"
  />
  <path
    d="M64 18 V77"
    stroke="#1A1A1A"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M64 19 V76"
    stroke="url(#shaft)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Arrow head -->
  <path
    d="M39 57 L64 84 L89 57"
    fill="none"
    stroke="#0B0B0B"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadowGlow)"
  />
  <path
    d="M39 57 L64 84 L89 57"
    fill="none"
    stroke="url(#edge)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M40 57 L64 82 L88 57"
    fill="none"
    stroke="#171717"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Download tray -->
  <path
    d="M23 101 H105"
    stroke="#0B0B0B"
    stroke-width="11"
    stroke-linecap="round"
    filter="url(#shadowGlow)"
  />
  <path
    d="M23 101 H105"
    stroke="url(#edge)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M25 99.5 H103"
    stroke="#202020"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Small tray corner accents -->
  <path d="M28 101 V95" stroke="#5F5F5F" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M100 101 V95" stroke="#5F5F5F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Soft metallic highlights -->
  <path d="M64 21 V49" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
  <path d="M42 59 L64 81" stroke="#F0F0F0" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M27 99.5 H58" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.62"/>
</svg>
